<svg xmlns="http://www.w3.org/2000/svg" width="820" height="160" viewBox="0 0 820 160" fill="none">
  <defs>
    <linearGradient id="cleanSilverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6edf3" stop-opacity="0.26" />
      <stop offset="85%" stop-color="#e6edf3" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#e6edf3" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    .card-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1px; rx: 16px; }
    .stat-main-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #ffffff; }
    .stat-main-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #94a3b8; }
    .stat-badge-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #ffffff; text-anchor: end; }
    .stat-badge-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; text-anchor: end; }
  </style>

  <rect width="818" height="158" x="1" y="1" class="card-bg" />

  <!-- Top Metrics Row (Exact Clean Template Layout) -->
  <g transform="translate(28, 24)">
    <!-- Left: Total Contributions -->
    <text x="0" y="24" class="stat-main-num">886</text>
    <text x="0" y="44" class="stat-main-sub">contributions in the last year</text>

    <!-- Right: Active Days & Best Week -->
    <g transform="translate(760, 0)">
      <g transform="translate(-130, 0)">
        <text x="0" y="18" class="stat-badge-num">102</text>
        <text x="0" y="36" class="stat-badge-sub">active days</text>
