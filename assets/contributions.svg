  <path d="M 24.0,138.9 L 39.1,138.9 L 54.3,138.9 L 69.4,138.3 L 84.5,138.3 L 99.7,137.3 L 114.8,135.6 L 130.0,132.3 L 145.1,135.1 L 160.2,137.8 L 175.4,138.3 L 190.5,138.3 L 205.6,138.9 L 220.8,138.9 L 235.9,137.8 L 251.1,135.6 L 266.2,130.1 L 281.3,119.1 L 296.5,104.8 L 311.6,91.6 L 326.7,89.4 L 341.9,89.4 L 357.0,115.3 L 372.2,133.4 L 387.3,130.1 L 402.4,131.8 L 417.6,134.5 L 432.7,136.7 L 447.8,137.8 L 463.0,132.3 L 478.1,129.6 L 493.3,135.6 L 508.4,137.3 L 523.5,136.7 L 538.7,136.2 L 553.8,130.1 L 568.9,122.4 L 584.1,133.4 L 599.2,136.7 L 614.4,137.3 L 629.5,135.6 L 644.6,131.2 L 659.8,127.9 L 674.9,130.1 L 690.0,133.4 L 705.2,135.6 L 720.3,132.3 L 735.5,129.0 L 750.6,124.6 L 765.7,131.2 L 780.9,140.0 L 796.0,97.1" fill="none" stroke="url(#waveGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

