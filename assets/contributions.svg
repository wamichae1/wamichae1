<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150" fill="none">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="waveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <style>
    .card-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1px; rx: 12px; }
    .metric-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
    .metric-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e; }
    .badge-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .badge-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #64748b; }
  </style>

  <rect width="818" height="148" x="1" y="1" class="card-bg" />

  <!-- Top Metrics Row -->
  <g transform="translate(24, 24)">
    <!-- Big Number -->
    <text x="0" y="20" class="metric-val">886</text>
    <text x="0" y="36" class="metric-sub">contributions in 2026</text>

    <!-- Stat Badges Right -->
    <g transform="translate(560, 4)">
      <g transform="translate(0, 0)">
        <text x="0" y="14" class="badge-label">active days</text>
        <text x="0" y="30" class="badge-val">102 days</text>
      </g>
      <g transform="translate(110, 0)">
        <text x="0" y="14" class="badge-label">best week</text>
        <text x="0" y="30" class="badge-val">125 commits</text>
      </g>
    </g>
  </g>

