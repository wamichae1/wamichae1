<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" fill="none">
  <style>
    .frame-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1px; rx: 12px; }
    .card-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; font-weight: 600; fill: #f0f6fc; letter-spacing: 0.5px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
    
    .slide-0 {
      animation: animSlide0 12s infinite ease-in-out;
    }
    @keyframes animSlide0 {
      0% { opacity: 1; transform: translateY(0px); }
      0.0% { opacity: 0; transform: translateY(6px); }
      0.0% { opacity: 1; transform: translateY(0); }
      28.3% { opacity: 1; transform: translateY(0); }
      33.3% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0px); }
    }

    .slide-1 {
      animation: animSlide1 12s infinite ease-in-out;
    }
    @keyframes animSlide1 {
      0% { opacity: 0; transform: translateY(6px); }
      31.3% { opacity: 0; transform: translateY(6px); }
      33.3% { opacity: 1; transform: translateY(0); }
      61.7% { opacity: 1; transform: translateY(0); }
      66.7% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    .slide-2 {
      animation: animSlide2 12s infinite ease-in-out;
    }
    @keyframes animSlide2 {
      0% { opacity: 0; transform: translateY(6px); }
      64.7% { opacity: 0; transform: translateY(6px); }
      66.7% { opacity: 1; transform: translateY(0); }
      95.0% { opacity: 1; transform: translateY(0); }
      100.0% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; transform: translateY(-6px); }
    }
  </style>

  <rect width="818" height="168" x="1" y="1" class="frame-bg" />
  
    <!-- Slide 1: SearchLabs -->
    <g class="slide slide-0">
      <g transform="translate(36, 32)">
        <circle cx="12" cy="4" r="2.5" stroke="#818cf8" stroke-width="1.8" fill="none" />
              <circle cx="4" cy="18" r="2.5" stroke="#818cf8" stroke-width="1.8" fill="none" />
              <circle cx="20" cy="18" r="2.5" stroke="#818cf8" stroke-width="1.8" fill="none" />
              <line x1="12" y1="6.5" x2="4" y2="15.5" stroke="#818cf8" stroke-width="1.8" />
              <line x1="12" y1="6.5" x2="20" y2="15.5" stroke="#818cf8" stroke-width="1.8" />
              <line x1="6.5" y1="18" x2="17.5" y2="18" stroke="#818cf8" stroke-width="1.8" />
      </g>
      <text x="76" y="52" class="card-title">SearchLabs</text>
      <text x="36" y="88" class="card-desc">Visualize search algorithms.</text>

      <!-- Language Bar -->
      <rect x="36" y="112" width="750" height="7" rx="3.5" fill="rgba(255,255,255,0.06)" />
      <rect x="36" y="112" width="588" height="7" rx="3.5" fill="#3572A5" />
      <rect x="624" y="112" width="111.00000000000001" height="7" rx="3.5" fill="#f1e05a" />
      <rect x="735" y="112" width="51.00000000000001" height="7" rx="3.5" fill="#563d7c" />

      <!-- Language Badges -->
      <g transform="translate(36, 142)">
        <g transform="translate(0, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#3572A5" />
        <text x="8" y="0">Python <tspan fill="#f0f6fc" font-weight="600">78.4%</tspan></text>
      </g>
      <g transform="translate(135, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#f1e05a" />
        <text x="8" y="0">JavaScript <tspan fill="#f0f6fc" font-weight="600">14.8%</tspan></text>
      </g>
      <g transform="translate(270, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#563d7c" />
        <text x="8" y="0">CSS <tspan fill="#f0f6fc" font-weight="600">6.8%</tspan></text>
      </g>
      </g>
    </g>

    <!-- Slide 2: Speculatr -->
    <g class="slide slide-1">
      <g transform="translate(36, 32)">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" stroke="#818cf8" stroke-width="1.8" fill="none"></polyline>
              <polyline points="17 6 23 6 23 12" stroke="#818cf8" stroke-width="1.8" fill="none"></polyline>
      </g>
      <text x="76" y="52" class="card-title">Speculatr</text>
      <text x="36" y="88" class="card-desc">Analyze markets. Make decisions.</text>

      <!-- Language Bar -->
      <rect x="36" y="112" width="750" height="7" rx="3.5" fill="rgba(255,255,255,0.06)" />
      <rect x="36" y="112" width="687" height="7" rx="3.5" fill="#3572A5" />
      <rect x="723" y="112" width="63.00000000000001" height="7" rx="3.5" fill="#89e051" />

      <!-- Language Badges -->
      <g transform="translate(36, 142)">
        <g transform="translate(0, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#3572A5" />
        <text x="8" y="0">Python <tspan fill="#f0f6fc" font-weight="600">91.6%</tspan></text>
      </g>
      <g transform="translate(135, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#89e051" />
        <text x="8" y="0">Shell <tspan fill="#f0f6fc" font-weight="600">8.4%</tspan></text>
      </g>
      </g>
    </g>

    <!-- Slide 3: michaelwang.dev -->
    <g class="slide slide-2">
      <g transform="translate(36, 32)">
        <polyline points="16 18 22 12 16 6" stroke="#818cf8" stroke-width="1.8" fill="none"></polyline>
              <polyline points="8 6 2 12 8 18" stroke="#818cf8" stroke-width="1.8" fill="none"></polyline>
      </g>
      <text x="76" y="52" class="card-title">michaelwang.dev</text>
      <text x="36" y="88" class="card-desc">Personal website and blog.</text>

      <!-- Language Bar -->
      <rect x="36" y="112" width="750" height="7" rx="3.5" fill="rgba(255,255,255,0.06)" />
      <rect x="36" y="112" width="543.0000000000001" height="7" rx="3.5" fill="#3178c6" />
      <rect x="579.0000000000001" y="112" width="136.5" height="7" rx="3.5" fill="#563d7c" />
      <rect x="715.5000000000001" y="112" width="70.5" height="7" rx="3.5" fill="#f1e05a" />

      <!-- Language Badges -->
      <g transform="translate(36, 142)">
        <g transform="translate(0, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#3178c6" />
        <text x="8" y="0">TypeScript <tspan fill="#f0f6fc" font-weight="600">72.4%</tspan></text>
      </g>
      <g transform="translate(135, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#563d7c" />
        <text x="8" y="0">CSS <tspan fill="#f0f6fc" font-weight="600">18.2%</tspan></text>
      </g>
      <g transform="translate(270, 0)" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #8b949e;">
        <circle cx="0" cy="-3" r="3.5" fill="#f1e05a" />
        <text x="8" y="0">JavaScript <tspan fill="#f0f6fc" font-weight="600">9.4%</tspan></text>
      </g>
      </g>
    </g>
</svg>
