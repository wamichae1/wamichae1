  <style>
    .frame-bg { fill: #0d1117; stroke: #21262d; stroke-width: 1px; rx: 16px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #f8fafc; letter-spacing: -0.2px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    
    .slide-0 {
      animation: animSlide0 15s infinite ease-in-out;
    }
    @keyframes animSlide0 {
      0% { opacity: 1; transform: translateY(0px); }
      0.0% { opacity: 0; transform: translateY(4px); }
      0.0% { opacity: 1; transform: translateY(0px); }
      29.3% { opacity: 1; transform: translateY(0px); }
      33.3% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0px); }
    }

    .slide-1 {
      animation: animSlide1 15s infinite ease-in-out;
    }
    @keyframes animSlide1 {
      0% { opacity: 0; transform: translateY(4px); }
      31.8% { opacity: 0; transform: translateY(4px); }
      33.3% { opacity: 1; transform: translateY(0px); }
      62.7% { opacity: 1; transform: translateY(0px); }
      66.7% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; transform: translateY(4px); }
    }

    .slide-2 {
      animation: animSlide2 15s infinite ease-in-out;
    }
    @keyframes animSlide2 {
      0% { opacity: 0; transform: translateY(4px); }
      65.2% { opacity: 0; transform: translateY(4px); }
      66.7% { opacity: 1; transform: translateY(0px); }
      96.0% { opacity: 1; transform: translateY(0px); }
      100.0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; transform: translateY(4px); }
    }
  </style>

